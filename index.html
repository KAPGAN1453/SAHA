<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutlu Akü - Saha Ziyaret Portalı</title>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <!-- SheetJS (Excel için) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d32f2f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            --primary-red: #d32f2f;
            --dark-red: #9a0007;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --input-bg: #2d2d2d;
            --text-light: #e0e0e0;
            --text-gray: #aaaaaa;
            --border-color: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); border: 1px solid var(--border-color); }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; border-bottom: 2px solid var(--primary-red); padding-bottom: 15px; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-circle { background: var(--primary-red); color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; text-align: center; line-height: 1.1; }
        .title h1 { font-size: 18px; color: white; letter-spacing: 0.5px; }
        .title p { font-size: 12px; color: var(--text-gray); }

        .auth-container { display: flex; flex-direction: column; gap: 15px; }
        .auth-title { font-size: 16px; font-weight: bold; color: white; margin-bottom: 5px; border-left: 3px solid var(--primary-red); padding-left: 8px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--text-gray); font-weight: 500; }
        
        input, select, textarea { 
            width: 100%; 
            padding: 10px 12px; 
            background-color: #2d2d2d !important; 
            border: 1px solid var(--border-color); 
            border-radius: 6px; 
            color: #ffffff !important; 
            font-size: 14px; 
            outline: none; 
            transition: border-color 0.3s; 
        }
        
        input:read-only {
            background-color: #222222 !important;
            color: #888888 !important;
            cursor: not-allowed;
        }

        input:focus, select:focus, textarea:focus { border-color: var(--primary-red); }
        
        select option { 
            background-color: #2d2d2d !important; 
            color: #ffffff !important; 
            padding: 10px; 
        }

        textarea { resize: vertical; min-height: 80px; }

        button.btn-primary { width: 100%; background: var(--primary-red); color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 5px; }
        button.btn-primary:hover { background: var(--dark-red); }
        
        button.btn-gray { background: #444; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        button.btn-gray:hover { background: #555; }

        .records-section { margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 20px; }
        .record-item { background: var(--input-bg); padding: 12px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--primary-red); }
        
        .hidden { display: none !important; }
        .user-badge { display: flex; justify-content: space-between; align-items: center; background: var(--input-bg); padding: 10px 15px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; }
        
        .footer-credit { text-align: center; margin-top: 20px; font-size: 11px; color: var(--text-gray); }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="logo-area">
            <div class="logo-circle">MUTLU AKÜ</div>
            <div class="title">
                <h1>Saha Ziyaret Portalı</h1>
                <p>Bayi ve Ziyaret Yönetim Sistemi</p>
            </div>
        </div>
    </div>

    <!-- GİRİŞ EKRANI (Kayıt Ol kaldırıldı) -->
    <div id="authSection" class="auth-container">
        <div class="auth-title">Sistem Girişi</div>
        <div id="loginForm">
            <div class="form-group">
                <label>Kullanıcı Adı</label>
                <input type="text" id="loginUser" placeholder="Kullanıcı adınızı girin (Örn: UKUTLUK)">
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="loginPass" placeholder="Şifrenizi girin">
            </div>
            <button class="btn-primary" onclick="girisYap()">Sisteme Giriş Yap</button>
        </div>
    </div>

    <!-- ANA FORM VE YÖNETİM EKRANI -->
    <div id="mainSection" class="hidden">
        <div class="user-badge">
            <span id="currentUserBadge">👤 UMITK</span>
            <div style="display: flex; gap: 6px;">
                <button class="btn-gray" onclick="sifreDegistirModal()">Şifre Değiştir</button>
                <button class="btn-gray" onclick="cikisYap()">Çıkış Yap</button>
            </div>
        </div>

        <form id="visitForm" onsubmit="event.preventDefault(); kaydet();">
            <input type="hidden" id="editId">
            
            <div class="form-group">
                <label>Ziyaret Tarihi (Bugün veya Dün)</label>
                <input type="date" id="tarih" required>
            </div>

            <div class="form-group">
                <label>Bölge Müdürü</label>
                <select id="bolge_muduru" onchange="yoneticileriGuncelle()">
                    <option value="">Seçiniz...</option>
                    <option value="Mustafa Kuşcu">Mustafa Kuşcu</option>
                    <option value="Berk Azat">Berk Azat</option>
                    <option value="Hürhan Sert">Hürhan Sert</option>
                </select>
            </div>

            <div class="form-group">
                <label>Bölge Satış Yöneticisi</label>
                <select id="satis_yoneticisi" disabled onchange="distributorleriGuncelle()">
                    <option value="">Önce Bölge Müdürü Seçiniz...</option>
                </select>
            </div>

            <div class="form-group">
                <label>Distribütör / Bayi</label>
                <select id="distributor" disabled>
                    <option value="">Önce Saha Yöneticisi Seçiniz...</option>
                </select>
            </div>

            <div class="form-group">
                <label>İl Seçimi</label>
                <select id="il_secimi" onchange="ilceleriGuncelle()">
                    <option value="">İl Seçiniz</option>
                </select>
            </div>

            <div class="form-group">
                <label>İlçe Seçimi</label>
                <select id="ilce_secimi">
                    <option value="">Önce İl Seçiniz</option>
                </select>
            </div>

            <div class="form-group">
                <label>Bayi / İşyeri İsmi</label>
                <input type="text" id="isyeri_adi" placeholder="İşyeri ünvanı" required>
            </div>

            <div class="form-group">
                <label>Görüşülen Yetkili (Ad Soyad)</label>
                <input type="text" id="sahip_ad_soyad" placeholder="Yetkili kişi">
            </div>

            <div class="form-group">
                <label>Telefon Numarası</label>
                <input type="tel" id="telefon" placeholder="05XX XXX XX XX">
            </div>

            <div class="form-group">
                <label>Mevcut Akü Stok Adedi</label>
                <input type="number" id="urun_adedi" placeholder="Örn: 45">
            </div>

            <div class="form-group">
                <label>Rakip / Diğer Markalar</label>
                <input type="text" id="markalar" placeholder="Bulunan diğer markalar">
            </div>

            <div class="form-group">
                <label>Notlar</label>
                <textarea id="notlar" placeholder="Ziyaret ile ilgili ek notlar ve açıklamalar..."></textarea>
            </div>

            <button type="submit" class="btn-primary">Ziyareti Kaydet / Güncelle</button>
            <button type="button" class="btn-gray" style="width:100%; margin-top:8px;" onclick="formTemizle()">Formu Temizle</button>
        </form>

        <!-- Kayıtlar ve Raporlama -->
        <div class="records-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 id="recordsTitle" style="font-size: 15px;">Ziyaret Kayıtlarım</h3>
                <button class="btn-primary" style="margin-top:0; padding: 6px 12px; font-size: 12px; width: auto;" onclick="exceleAktar()">📊 Excel'e Aktar</button>
            </div>
            <div id="recordsList">
                <!-- Kayıtlar dinamik yüklenecek -->
            </div>
        </div>
    </div>

    <div class="footer-credit">Designed & Developed by Ümit Tahir KUTLUK</div>
</div>

    function tarihiSinirla() {
        const tarihInput = document.getElementById('tarih');
        if (!tarihInput) return;

        const bugun = new Date();
        const bugunMetni = [bugun.getFullYear(), String(bugun.getMonth() + 1).padStart(2, '0'), String(bugun.getDate()).padStart(2, '0')].join('-');
        const dun = new Date(bugun);
        dun.setDate(dun.getDate() - 1);
        const dunMetni = [dun.getFullYear(), String(dun.getMonth() + 1).padStart(2, '0'), String(dun.getDate()).padStart(2, '0')].join('-');

        tarihInput.min = dunMetni;
        tarihInput.max = bugunMetni;
        if (!tarihInput.value || tarihInput.value < dunMetni || tarihInput.value > bugunMetni) {
            tarihInput.value = bugunMetni;
        }
    }

    async function girisYap() {
        const uInput = document.getElementById('loginUser').value.trim();
        const u = uInput.toUpperCase(); 
        const p = document.getElementById('loginPass').value.trim();

        if(!u || !p) { alert("Lütfen kullanıcı adı ve şifrenizi giriniz."); return; }

        try {
            // Firebase üzerinden güncel şifreyi kontrol et (varsayılanlar hafızadan alınır)
            const docRef = db.collection("kullaniciSifreleri").doc(u);
            const doc = await docRef.get();
            
            let dogruSifre = tanimliKullanicilar[u];
            if (doc.exists && doc.data().sifre) {
                dogruSifre = doc.data().sifre;
            }

            if (tanimliKullanicilar[u] !== undefined && dogruSifre === p) {
                girisBasarili(u);
            } else {
                alert("Hatalı kullanıcı adı veya şifre!");
            }
        } catch(error) {
            // Firebase çevrimdışıysa statik şifre kontrolü yap
            if (tanimliKullanicilar[u] !== undefined && tanimliKullanicilar[u] === p) {
                girisBasarili(u);
            } else {
                alert("Giriş yapılamadı. Kullanıcı adı veya şifre hatalı.");
            }
        }
    }

        document.getElementById('recordsTitle').innerText = isAdmin ? "Tüm Saha Ziyaret Kayıtları (Admin Görünümü)" : "Ziyaret Kayıtlarım";

        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('mainSection').classList.remove('hidden');

    }

    async function verileriGetirVeListele() {
        try {
            let snapshot;
            if (isAdmin) {
                // Admin tüm kayıtları çeker
                snapshot = await db.collection("ziyaretler").get();
            } else {
                // Saha kullanıcısı sadece kendi kayıtlarını çeker
                snapshot = await db.collection("ziyaretler")
                                         .where("kullanici", "==", currentUser)
                                         .get();
            }

            globalVeriler = [];
            snapshot.forEach(doc => {
                globalVeriler.push({ firebaseId: doc.id, ...doc.data() });
            });
            globalVeriler.sort((a, b) => a.id - b.id);
            listeleEkraniniGuncelle();
        } catch(error) {
            console.error("Veriler çekilirken hata:", error);
        }
    }

    async function kaydet() {
        const isyeri = document.getElementById('isyeri_adi').value.trim();
        if(!isyeri) { alert("Lütfen Bayi / İşyeri İsmi giriniz!"); return; }

        const il = document.getElementById('il_secimi').value;
        const ilce = document.getElementById('ilce_secimi').value;
        const konumMetni = (il || ilce) ? `${il} / ${ilce}` : '';

        const editId = document.getElementById('editId').value;

        const record = {
            id: editId ? parseInt(editId) : Date.now(),
            kullanici: currentUser,
            tarih: document.getElementById('tarih').value,
            bolge_muduru: document.getElementById('bolge_muduru').value,
            satis_yoneticisi: document.getElementById('satis_yoneticisi').value,
            distributor: document.getElementById('distributor').value,
            il: il,
            ilce: ilce,
            konum: konumMetni,
            isyeri_adi: isyeri,
            sahip_ad_soyad: document.getElementById('sahip_ad_soyad').value,
            telefon: document.getElementById('telefon').value,
            urun_adedi: document.getElementById('urun_adedi').value,
            markalar: document.getElementById('markalar').value,
            notlar: document.getElementById('notlar').value
        };

        try {
            if(editId) {
                const existing = globalVeriler.find(x => x.id === parseInt(editId));
                if(existing && existing.firebaseId) {
                    await db.collection("ziyaretler").doc(existing.firebaseId).set(record);
                }
            } else {
                await db.collection("ziyaretler").add(record);
            }

            alert("Kayıt başarıyla buluta saklandı!");
            formTemizle();
            verileriGetirVeListele();
        } catch(error) {
            alert("Kayıt sırasında hata: " + error.message);
        }
    }

        document.getElementById('satis_yoneticisi').innerHTML = '<option value="">Önce Bölge Müdürü Seçiniz...</option>';

    function listeleEkraniniGuncelle() {
        const listDiv = document.getElementById('recordsList');
        listDiv.innerHTML = "";

        if(globalVeriler.length === 0) {
            listDiv.innerHTML = "<p style='color:var(--text-gray); font-size:12px;'>Kayıtlı ziyaret bulunmuyor.</p>";
            return;
        }

        globalVeriler.slice().reverse().forEach(item => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'record-item';
            
            itemDiv.innerHTML = `
                <div>
                    <strong>${item.isyeri_adi}</strong> (${item.konum || 'Konum Yok'})<br>
                    <small style="color:var(--text-gray);">Tarih: ${item.tarih} | Temsilci: <b>${item.kullanici}</b></small>
                </div>
                <div style="display: flex; gap: 6px;">
                    <button class="btn-gray" onclick="duzenleKayit(${item.id})">Düzenle</button>
                    <button class="btn-gray" style="background:var(--primary-red);" onclick="silKayit('${item.firebaseId}')">Sil</button>
                </div>
            `;
            listDiv.appendChild(itemDiv);
        });
    }

    function duzenleKayit(id) {
        const item = globalVeriler.find(x => x.id === id);
        if(!item) return;

        document.getElementById('editId').value = item.id;
        document.getElementById('tarih').value = item.tarih || "";
        document.getElementById('bolge_muduru').value = item.bolge_muduru || "";
        
        yoneticileriGuncelle();
        document.getElementById('satis_yoneticisi').value = item.satis_yoneticisi || "";
        
        distributorleriGuncelle();
        document.getElementById('distributor').value = item.distributor || "";
        
        document.getElementById('il_secimi').value = item.il || "";
        ilceleriGuncelle();
        document.getElementById('ilce_secimi').value = item.ilce || "";
        document.getElementById('isyeri_adi').value = item.isyeri_adi || "";
        document.getElementById('sahip_ad_soyad').value = item.sahip_ad_soyad || "";
        document.getElementById('telefon').value = item.telefon || "";
        document.getElementById('urun_adedi').value = item.urun_adedi || "";
        document.getElementById('markalar').value = item.markalar || "";
        document.getElementById('notlar').value = item.notlar || "";

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

            alert("Aktarılacak kayıt bulunmuyor!");
            return;
        }

        // Aynı günün farklı bayi işaretlemelerini tek blokta topla; bayi sütunları yan yana oluşsun.
        const raporMap = {};
        globalVeriler.forEach(item => {
            const tarih = item.tarih || item.Tarih || "";
            const bolgeMuduru = item.bolge_muduru || item.bolgeMuduru || "";
            const bolgeSahaYonetici = item.satis_yoneticisi || item.satis_yoneti || item.kullanici || "";
            const distributor = item.distributor || item.isyeri_adi || "";
            // Distribütörü anahtara katma: aynı gün farklı işaretlenen bayiler Bayi 1, Bayi 2...
            // olarak aynı Excel bloğunda yan yana aktarılmalıdır.
            const key = `${tarih}_${bolgeMuduru}_${bolgeSahaYonetici}`;

            if (!raporMap[key]) {
                raporMap[key] = {
                    tarih,
                    bolgeMuduru,
                    bolgeSahaYonetici,
                    distributors: [],
                    bayiler: []
                };
            }

            if (distributor && !raporMap[key].distributors.includes(distributor)) {
                raporMap[key].distributors.push(distributor);
            }

            raporMap[key].bayiler.push({
                isyeriAdi: item.isyeri_adi || "",
                gorusulenYetkili: item.sahip_ad_soyad || item.yetkili_kisi || "",
                telefon: item.telefon || "",
                mevcutAkuStok: item.urun_adedi || item.mevcut_stok || item.stok_adedi || item.stok || item.adet || "",
                rakipMarkalar: item.markalar || item.rakip_markalar || "",
                notlar: item.notlar || ""
            });
        });

        // ADMIN ile aynı: gruplar içindeki en yüksek bayi sayısı kadar sütun oluştur.
        let maxBayiSayisi = 1;
        Object.values(raporMap).forEach(grup => {
            maxBayiSayisi = Math.max(maxBayiSayisi, grup.bayiler.length);
        });

        const sheetData = [];
        const headers = ["Tarih", "Bölge Müdürü", "Bölge Saha Yöneticisi", "Distribütör", "Ziyaret"];
        for (let b = 1; b <= maxBayiSayisi; b++) headers.push(`Bayi ${b}`);
        headers.push("Toplam Ziyaret", "Hedef", "Hedef Gerçekleşme");
        sheetData.push(headers);

        const merges = [];
        let currentRowIndex = 1;
        Object.values(raporMap).forEach(grup => {
            const satirIsmi = [
                "Bayi / İşyeri İsmi",
                "Görüşülen Yetkili",
                "Telefon",
                "Mevcut Akü Stok Adedi",
                "Rakip / Diğer Markalar",
                "Notlar"
            ];

            for (let i = 0; i < 6; i++) {
                const row = [
                    i === 0 ? grup.tarih : "",
                    i === 0 ? grup.bolgeMuduru : "",
                    i === 0 ? grup.bolgeSahaYonetici : "",
                    i === 0 ? grup.distributors.join(" / ") : "",
                    satirIsmi[i]
                ];

                for (let b = 0; b < maxBayiSayisi; b++) {
                    const bayiVerisi = grup.bayiler[b];
                    if (!bayiVerisi) {
                        row.push("");
                    } else if (i === 0) {
                        row.push(bayiVerisi.isyeriAdi);
                    } else if (i === 1) {
                        row.push(bayiVerisi.gorusulenYetkili);
                    } else if (i === 2) {
                        row.push(bayiVerisi.telefon);
                    } else if (i === 3) {
                        row.push(bayiVerisi.mevcutAkuStok);
                    } else if (i === 4) {
                        row.push(bayiVerisi.rakipMarkalar);
                    } else {
                        row.push(bayiVerisi.notlar);
                    }
                }

                const toplamZiyaret = grup.bayiler.length;
                const hedef = 7;
                const gerceklesmeYuzdesi = Math.round((toplamZiyaret / hedef) * 100) + "%";
                row.push(i === 0 ? toplamZiyaret : "");
                row.push(i === 0 ? hedef : "");
                row.push(i === 0 ? gerceklesmeYuzdesi : "");
                sheetData.push(row);
            }

            const startRow = currentRowIndex;
            const endRow = currentRowIndex + 5;
            const toplamSutunSayisi = headers.length;
            [0, 1, 2, 3, toplamSutunSayisi - 3, toplamSutunSayisi - 2, toplamSutunSayisi - 1].forEach(colIdx => {
                merges.push({ s: { r: startRow, c: colIdx }, e: { r: endRow, c: colIdx } });
            });
            currentRowIndex += 6;
        });

        const worksheet = XLSX.utils.aoa_to_sheet(sheetData);
        worksheet['!merges'] = merges;

        const thinBorder = {
            top: { style: "thin", color: { rgb: "000000" } },
            bottom: { style: "thin", color: { rgb: "000000" } },
            left: { style: "thin", color: { rgb: "000000" } },
            right: { style: "thin", color: { rgb: "000000" } }
        };

        const range = XLSX.utils.decode_range(worksheet['!ref']);
        for (let R = range.s.r; R <= range.e.r; ++R) {
            for (let C = range.s.c; C <= range.e.c; ++C) {
                const cellAddress = XLSX.utils.encode_cell({ r: R, c: C });
                if (!worksheet[cellAddress]) worksheet[cellAddress] = { t: 's', v: '' };
                if (!worksheet[cellAddress].s) worksheet[cellAddress].s = {};
                worksheet[cellAddress].s.alignment = { vertical: "center", horizontal: "center", wrapText: false };
                worksheet[cellAddress].s.border = thinBorder;

                if (R >= 1) {
                    worksheet[cellAddress].s.font = { name: "Calibri", sz: 10, color: { rgb: "000000" } };
                    if (R % 5 === 2) {
                        worksheet[cellAddress].t = 's';
                        worksheet[cellAddress].v = String(worksheet[cellAddress].v || "");
                    }
                }

                if (R === 0) {
                    worksheet[cellAddress].s.font = { name: "Calibri", sz: 11, bold: true, color: { rgb: "000000" } };
                    if (C >= 0 && C <= 4) {
                        worksheet[cellAddress].s.fill = { patternType: "solid", fgColor: { rgb: "D3D3D3" } };
                    } else if (C >= 5 && C < range.e.c - 2) {
                        worksheet[cellAddress].s.fill = { patternType: "solid", fgColor: { rgb: "C6EFCE" } };
                    } else {
                        worksheet[cellAddress].s.fill = { patternType: "solid", fgColor: { rgb: "D3D3D3" } };
                    }
                }
            }
        }

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Saha Ziyaretleri");
        XLSX.writeFile(workbook, "Mutlu_Aku_Saha_Ziyaret_Raporu.xlsx");
    }
    
</script>
    <script>
      // PWA service worker: GitHub Pages'teki yeni sürümü otomatik algılar.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const registration = await navigator.serviceWorker.register('./sw.js', { scope: './' });
            registration.addEventListener('updatefound', () => {
              const worker = registration.installing;
              if (!worker) return;
              worker.addEventListener('statechange', () => {
                if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                  const update = document.createElement('div');
                  update.innerHTML = '<div style="position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#d32f2f;color:white;padding:14px 16px;border-radius:10px;box-shadow:0 4px 18px #0008;font-size:14px">Yeni sürüm hazır. <button style="float:right;background:white;color:#9a0007;border:0;border-radius:6px;padding:6px 10px;font-weight:bold" onclick="location.reload()">Güncelle</button></div>';
                  document.body.appendChild(update);
                }
              });
            });
          } catch (error) { console.warn('Service worker kaydı yapılamadı:', error); }
        });
      }
    </script>
